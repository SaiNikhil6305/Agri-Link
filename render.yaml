services:
  - type: web
    name: agri-link
    env: python
    buildCommand: "if command -v npm >/dev/null 2>&1; then npm install && npm run build; fi && pip install -r ml_backend/requirements.txt"
    startCommand: "python ml_backend/server.py"
    envVars:
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      # Firebase Web Configuration (embedded into frontend at build time)
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Backend Firebase Verification
      - key: FIREBASE_PROJECT_ID
        sync: false
