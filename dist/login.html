<!DOCTYPE html>
<html lang="en" data-role="farmer">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri-Link | Secure Access Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/login-CCdXSCCV.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/i18n---Gs5srm.js">
  <link rel="stylesheet" crossorigin href="/assets/i18n-Fs993OLP.css">
</head>
<body class="login-page-body">

    <!-- Dedicated Full-Page Login & Registration Gateway -->
    <div class="auth-page-container standalone-auth">
        <div class="auth-page-card">
            
            <!-- Login Top Bar: Logo & Language Switcher -->
            <div class="auth-card-topbar">
                <div class="auth-brand">
                    <div class="auth-logo-leaf">
                        <i class="fas fa-leaf"></i>
                    </div>
                    <div>
                        <h1 class="auth-brand-name">Agri-Link</h1>
                        <span class="auth-brand-tag" data-i18n="app_tagline">Autonomous Agricultural Quality & Fair Trade Network</span>
                    </div>
                </div>
                
                <!-- 13-Language Selector -->
                <div class="auth-lang-picker">
                    <button type="button" class="btn-login-lang" id="btn-login-lang" aria-haspopup="true" aria-expanded="false" title="Change Language / भाषा बदलें">
                        <i class="fas fa-globe"></i>
                        <span id="login-lang-label">English</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="login-lang-dropdown" id="login-lang-dropdown" style="display: none;">
                        <button type="button" class="login-lang-opt" data-lang="en">English (National)</button>
                        <button type="button" class="login-lang-opt" data-lang="hi">हिन्दी (Hindi)</button>
                        <button type="button" class="login-lang-opt" data-lang="mr">मराठी (Marathi)</button>
                        <button type="button" class="login-lang-opt" data-lang="te">తెలుగు (Telugu)</button>
                        <button type="button" class="login-lang-opt" data-lang="ta">தமிழ் (Tamil)</button>
                        <button type="button" class="login-lang-opt" data-lang="pa">ਪੰਜਾਬੀ (Punjabi)</button>
                        <button type="button" class="login-lang-opt" data-lang="gu">ગુજરાતી (Gujarati)</button>
                        <button type="button" class="login-lang-opt" data-lang="bn">বাংলা (Bengali)</button>
                        <button type="button" class="login-lang-opt" data-lang="kn">ಕನ್ನಡ (Kannada)</button>
                        <button type="button" class="login-lang-opt" data-lang="ml">മലയാളം (Malayalam)</button>
                        <button type="button" class="login-lang-opt" data-lang="or">ଓଡ଼ିଆ (Odia)</button>
                        <button type="button" class="login-lang-opt" data-lang="ur">اردو (Urdu)</button>
                        <button type="button" class="login-lang-opt" data-lang="as">অসমীয়া (Assamese)</button>
                    </div>
                </div>
            </div>

            <!-- Welcome Intro Banner -->
            <div class="auth-welcome-banner">
                <h2 data-i18n="auth_portal_title">Agri-Link Secure Access Gateway</h2>
                <p data-i18n="auth_portal_subtitle">Enter your registered credentials or select a demonstration profile to enter your workstation</p>
            </div>

            <!-- Navigation Tabs: Sign In / Create Account -->
            <div class="auth-tabs-nav">
                <button type="button" class="auth-tab-btn active" id="tab-login" data-i18n="auth_login_tab">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tab-register" data-i18n="auth_register_tab">Create New Account</button>
            </div>

            <!-- Feedback Alert Banner -->
            <div id="auth-alert-box" class="auth-alert" style="display: none;"></div>

            <!-- SIGN IN FORM -->
            <form id="form-login" class="auth-form-body">
                <div class="form-group mb-0">
                    <label for="login-email" data-i18n="auth_email_or_phone">Email Address or Mobile Number</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-user-circle auth-field-icon"></i>
                        <input type="text" id="login-email" placeholder="e.g. farmer@agrilink.in or 9876543210" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group mb-0">
                    <label for="login-password" data-i18n="auth_password">Password</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-lock auth-field-icon"></i>
                        <input type="password" id="login-password" placeholder="Enter your secure password" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pwd" id="btn-toggle-login-pwd" title="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth-submit" id="btn-login-submit">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="auth_btn_login">Sign In to Workstation</span>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="form-register" class="auth-form-body" style="display: none;">
                <div class="form-group mb-0">
                    <label for="reg-fullname" data-i18n="auth_full_name">Full Name / Organization</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-id-card auth-field-icon"></i>
                        <input type="text" id="reg-fullname" placeholder="e.g. Ramesh Kumar" required>
                    </div>
                </div>
                <div class="form-group mb-0">
                    <label for="reg-email" data-i18n="auth_email_or_phone">Email Address or Mobile Number</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-envelope auth-field-icon"></i>
                        <input type="text" id="reg-email" placeholder="e.g. farmer@agrilink.in or 9876543210" required>
                    </div>
                </div>
                <div class="form-group mb-0">
                    <label data-i18n="auth_preferred_role">Operational Role</label>
                    <div class="reg-role-options">
                        <label class="reg-role-radio active" id="label-role-farmer">
                            <input type="radio" name="reg-role" value="farmer" checked>
                            <span><i class="fas fa-tractor"></i> Farmer</span>
                        </label>
                        <label class="reg-role-radio" id="label-role-aggregator">
                            <input type="radio" name="reg-role" value="aggregator">
                            <span><i class="fas fa-layer-group"></i> Aggregator (FPO)</span>
                        </label>
                        <label class="reg-role-radio" id="label-role-buyer">
                            <input type="radio" name="reg-role" value="buyer">
                            <span><i class="fas fa-building"></i> Buyer</span>
                        </label>
                    </div>
                </div>
                <div class="form-group mb-0">
                    <div class="auth-label-row">
                        <label for="reg-location" data-i18n="auth_location">District / Location</label>
                        <button type="button" class="btn-auto-detect-link" id="btn-detect-reg-location-link" title="Auto-detect location via GPS or Network">
                            <i class="fas fa-crosshairs"></i> <span data-i18n="auth_auto_detect">Auto Detect</span>
                        </button>
                    </div>
                    <div class="auth-input-wrapper has-action-btn">
                        <i class="fas fa-map-marker-alt auth-field-icon"></i>
                        <input type="text" id="reg-location" placeholder="e.g. Ludhiana, Punjab" required>
                        <button type="button" class="btn-detect-location" id="btn-detect-reg-location" title="Auto-detect current location via GPS or Network">
                            <i class="fas fa-crosshairs"></i> <span data-i18n="auth_auto_detect">Auto Detect</span>
                        </button>
                    </div>
                    <div class="location-detect-status" id="reg-location-status" style="display: none;"></div>
                </div>
                <div class="form-group mb-0">
                    <label for="reg-password" data-i18n="auth_password">Password (Min 6 Characters)</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-lock auth-field-icon"></i>
                        <input type="password" id="reg-password" placeholder="Create a secure password" minlength="6" required>
                        <button type="button" class="btn-toggle-pwd" id="btn-toggle-reg-pwd" title="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group mb-0">
                    <label for="reg-confirm-password" data-i18n="auth_confirm_password">Confirm Password</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-check-double auth-field-icon"></i>
                        <input type="password" id="reg-confirm-password" placeholder="Re-enter your password" minlength="6" required>
                    </div>
                </div>
                <button type="submit" class="btn-auth-submit" id="btn-register-submit">
                    <i class="fas fa-user-plus"></i> <span data-i18n="auth_btn_register">Register & Enter Workstation</span>
                </button>
            </form>



            <!-- Footer links -->
            <div class="auth-footer-bar" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 0.85rem; color: #64748b;">
                <span><i class="fas fa-shield-alt" style="color: #10b981;"></i> Secure PBKDF2 Password Hashing & Token Sessions</span>
                <a href="./index.html" style="color: #059669; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                    <span>Direct Workstation Access</span> <i class="fas fa-arrow-right"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Internationalization & Login Engine Scripts -->
</body>
</html>
